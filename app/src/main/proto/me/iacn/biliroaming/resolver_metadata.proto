syntax = "proto3";
package me.iacn.biliroaming.resolver;
option java_package = "me.iacn.biliroaming.resolver";
option java_outer_classname = "ResolverMetadata";

message Device {
  int32 app_id = 1;
  int32 build = 2;
  string buvid = 3;
  string mobi_app = 4;
  string platform = 5;
  string channel = 7;
  string osver = 10;
  string version_name = 13;
}
message Metadata {
  string access_key = 1;
  string mobi_app = 2;
  string device = 3;
  int32 build = 4;
  string channel = 5;
  string buvid = 6;
  string platform = 7;
}
message LocaleIds { string language = 1; string script = 2; string region = 3; }
message Locale { LocaleIds c_locale = 1; LocaleIds s_locale = 2; string timezone = 4; }
message Network { int32 type = 1; }
message Fawkes { string appkey = 1; string env = 2; string session_id = 3; }
